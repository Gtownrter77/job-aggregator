# Builds the Android thin-client app (android/) on every push that touches it.
#
# * Produces a DEBUG-signed APK (package com.gtownrter77.jobaggregator.debug, installs
#   next to the release app) and uploads it as a build artifact.
# * Needs NO secrets. The release keystore is deliberately NOT in GitHub; release APKs
#   are built and signed on Ryan's machine (see android/README.md) and attached to
#   GitHub Releases by hand.
name: android

on:
  push:
    paths:
      - "android/**"
      - ".github/workflows/android.yml"
  pull_request:
    paths:
      - "android/**"
      - ".github/workflows/android.yml"
  workflow_dispatch: {}

permissions:
  contents: read

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: android
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: android-actions/setup-android@v3
        with:
          packages: "platform-tools platforms;android-34 build-tools;34.0.0"

      - uses: gradle/actions/setup-gradle@v4

      - name: Unit tests, lint, debug APK
        run: ./gradlew --no-daemon testDebugUnitTest lintDebug assembleDebug

      - name: Rename APK
        run: cp app/build/outputs/apk/debug/app-debug.apk JobAggregator-debug.apk

      - uses: actions/upload-artifact@v4
        with:
          name: JobAggregator-debug-apk
          path: android/JobAggregator-debug.apk
          if-no-files-found: error
          retention-days: 30

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: android-reports
          path: |
            android/app/build/reports/
            android/app/build/test-results/
          retention-days: 7
