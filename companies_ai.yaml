# AI-company job boards for the `remote_ai` track (public, no-auth ATS APIs).
# Every slug returned HTTP 200 with live postings, and the board was checked to be
# the right company (2026-10-07). Only REMOTE postings are kept from these boards,
# but every remote role counts (sales, support, ops, recruiting, data annotation...),
# not just ML engineering. Verify with: python -m aggregator verify-slugs --track remote_ai

