# Seed list of company job boards on public, no-auth ATS APIs.
# Every slug below returned HTTP 200 when verified with
#   python -m aggregator verify-slugs
# Add a company: find its careers page URL, e.g.
#   https://job-boards.greenhouse.io/<slug>   -> greenhouse
#   https://jobs.lever.co/<slug>              -> lever
#   https://jobs.ashbyhq.com/<slug>           -> ashby
# then add {slug, name} under the matching key and re-run verify-slugs.
# `atl: true` marks employers headquartered in / hiring heavily in Atlanta.

greenhouse:
  - {slug: onetrust, name: OneTrust, atl: true}
  - {slug: florencehealthcare, name: Florence Healthcare, atl: true}
  - {slug: qgenda, name: QGenda, atl: true}
