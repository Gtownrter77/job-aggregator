# ---------------------------------------------------------------------------
# Search tracks. Every job is tagged with the track(s) it matched (jobs.track),
# and the UI has a Track filter. `fetch --track remote_ai` runs only one track.
#   atlanta   : ALL job types within 50 mi of Atlanta (the search/jobspy/ats/metro
#               settings above).
#   remote_ai : remote AI / ML / automation jobs located ANYWHERE (US-remote,
#               worldwide, EU, any country). Each job gets a `remote_region`
#               (US, Worldwide, Europe, UK, Canada, LATAM, APAC, ...) when the
#               posting states one, else "Unspecified".
# ---------------------------------------------------------------------------
tracks:
  atlanta:
    enabled: true
  remote_ai:
    enabled: true
    remote_only: true
    # AI-company boards: every REMOTE posting is kept (sales, support, ops, data
    # annotation, recruiting... not just ML engineering).
    companies_file: companies_ai.yaml
    # also keep remote postings with an AI keyword in the title from companies.yaml boards
    scan_main_companies: true
    # A posting from a non-AI company (companies.yaml boards, JobSpy results) is
    # AI-related if its TITLE has one of these. description_min_hits > 0 also accepts
    # postings whose description mentions them that often (noisy: most companies'
    # boilerplate now says "AI", so it is off by default).
    # Short ALL-CAPS words (AI, ML, LLM, NLP) match case-sensitively.
    keywords: ["AI", "ML", "LLM", "LLMs", "NLP", "GenAI", "machine learning", "artificial intelligence",
               "generative", "prompt engineer", "prompt engineering", "AI operations", "AI trainer", "AI tutor",
               "data annotation", "data annotator", "data labeling", "annotation", "RLHF", "model evaluation",
               "AI product", "automation", "intelligent automation", "AI solutions", "conversational",
               "chatbot", "AI agent", "agentic", "computer vision", "deep learning", "data scientist"]
    description_min_hits: 0
    jobspy:
      # Glassdoor's remote search (is_remote) works in JobSpy 1.2; only rows Glassdoor marks remote
      # (or say "remote") are kept. Google is blocked (see jobspy.sites); ZipRecruiter is US/Canada.
      sites: {indeed: true, linkedin: true, zip_recruiter: true, glassdoor: true, google: false}
      # Indeed is per-country (country_indeed); LinkedIn "Worldwide" covers every country.
      locations: {indeed: "United States", linkedin: "Worldwide", zip_recruiter: "United States"}
      results_wanted_by_site: {indeed: 100}
      search_terms: ["artificial intelligence", "machine learning", "LLM", "prompt engineer", "AI operations",
                     "AI trainer", "data annotation", "AI product manager", "automation specialist",
                     "AI solutions", "AI sales", "AI customer success", "AI entry level"]
      results_wanted: 25
      hours_old: 168

scoring:
  # tfidf (default, always available) or embeddings (needs
  # `pip install sentence-transformers`; falls back to tfidf if missing).
  method: tfidf
  # Free-text description of what you want. Used for the stored relevance
  # score shown in the UI. Leave empty to rank by search-box query instead.
  profile: ""
  # Resume-derived text used for the stored relevance score (resume <-> posting TF-IDF).
  resume_file: "resumes/profile_text.txt"
  embedding_model: "sentence-transformers/all-MiniLM-L6-v2"

llm:
  # LOCAL Ollama server (free, open source, no API keys, no token limits).
  # Install: curl -fsSL https://ollama.com/install.sh | sh ; scripts/ollama-bg.sh ; ollama pull llama3.2:3b
  # Everything is skipped automatically (templates are used) when Ollama isn't reachable.
  enabled: true
  ollama_url: "http://localhost:11434"
  # Small open-weights model that runs on CPU (~2 GB RAM). Bigger = better prose but slower;
  # e.g. "llama3.1:8b" needs ~6 GB free RAM and is ~2.5x slower on CPU.
  model: "llama3.2:3b"
  num_ctx: 4096
  keep_alive: "15m"           # unload the model from RAM after 15 idle minutes
  timeout_seconds: 240        # per request
  draft_attempts: 3           # tries per touch before that touch falls back to the template
  fit_summary: true           # 1-2 sentence "why it fits / main gap" per top match in the auto digest
  extract_on_fetch: false     # per-job structured extraction during fetch (slow on CPU: ~20 s/job)
  max_jobs_per_run: 50

database:
  # SQLite for v1. Schema is plain SQL kept Postgres-portable.
  path: "data/jobs.db"

# `python -m aggregator auto` / scripts/auto_run.sh (scheduled 3x per weekday):
# fetch both tracks, rescore, auto-qualify up to `max_qualify_per_run` strong NEW matches
# (drafts only; nothing is ever sent), then write logs/latest-digest.md.
auto:
  # TF-IDF cosine score vs the resume profile. 0.04 is roughly the top 0.5% of postings in the
  # DB (median ~0.009, 99th pct ~0.033); combined with fit=direct (title is construction /
  # field / project / sales / facilities work, or >= 3 resume skills in the posting).
  min_score: 0.04
  require_direct_fit: true
  max_qualify_per_run: 5
  max_per_company_per_run: 2
  new_within_hours: 72          # only jobs first seen this recently are auto-qualify candidates
  exclude_title_regex: "\\b(intern|internship|co-?op|college grads?|new grads?|student|apprentice)\\b"
  top_n: 5                      # matches listed in the digest
  digest_dir: "logs"

# Company info for qualified leads + top digest matches (aggregator/enrich.py, `python -m
# aggregator enrich`). Free sources only, in this order: JobSpy's employer fields + the posting
# text (emails, recruiter name, direct apply link), the posting's ATS (Greenhouse/Lever/Ashby
# public APIs), one DuckDuckGo search for the company domain, then a few public pages on that
# domain (home, careers, jobs, contact, about). No API keys, no guessing email patterns, no
# SMTP probing, no logins, no form submits. Only a HIRING address (hr@/careers@/jobs@/
# recruiting@/talent@/applynow@... or one labeled HR/careers) read verbatim from a cited page
# or the posting is ever filled in as a lead's contact, and only when the lead has none.
enrich:
  enabled: true
  cache_days: 30                # re-crawl a company's site after this many days
  max_seconds_per_run: 270      # time budget inside `auto` (keeps a run < ~5 extra minutes)
  max_companies_per_run: 25     # web lookups per run (cached companies don't count)
  max_pages_per_company: 8
  request_timeout_seconds: 10
  delay_seconds: 0.6            # pause between requests to the same site
  search: true                  # DuckDuckGo search to find the company domain / LinkedIn page
  fetch_board_details: true     # on-demand LinkedIn/ZipRecruiter/Glassdoor posting details for rows without a description
  auto_set_contact: true        # fill an EMPTY lead contact with a HIRING email found verbatim (never overwrites)
  top_jobs: 20                  # `enrich --top N` default / digest top matches enriched per auto run
  user_agent: "Mozilla/5.0 (compatible; job-aggregator-enrich/1.0; +https://github.com/Gtownrter77/job-aggregator)"

server:
  host: "0.0.0.0"
  port: 8765

followups:
  # 3-touch follow-up DRAFT queue for qualified jobs. Nothing is ever sent
  # automatically: drafts must be approved in the UI and then sent with an
  # explicit `python -m aggregator send-approved` (which also requires
  # sending_enabled: true AND SMTP_* env vars).
  # Put your REAL name/phone/email in config.local.yaml (gitignored), not here.
  applicant_name: "Your Name"           # fills {applicant_name}; first line of the signature
  applicant_phone: "555-555-5555"       # signature line 2 (leave "" to omit)
  applicant_email: "you@example.com"    # signature line 3 (leave "" to omit)
  use_llm: true                         # use local Ollama (if llm.enabled & reachable) to write drafts; else rich templates
  default_contact_name: "Hiring Team"   # fills {name} when no contact name is known
  schedule_days: [0, 3, 10]             # touch 1/2/3 offsets (days) from the qualify date
  skip_weekends: true                   # a Sat/Sun date moves to Monday (so Day 3 can become Day 4-5)
  templates_file: "followup_templates.yaml"
  # Auto-qualify jobs whose stored score >= this after each fetch. null = manual only.
  # (Scores are 0 unless scoring.profile is set.)
  auto_qualify_score: null
  # Prefill a lead's contact email ONLY when an address is written in the posting
  # text itself (e.g. "send resumes to jobs@acme.com"). Never guessed or scraped elsewhere.
  contact_from_posting: true
  sending_enabled: false                # master switch for send-approved

# Facts about YOU, used to personalize follow-up drafts and to score jobs.
# Override these in config.local.yaml (gitignored). resumes/ is gitignored too:
# put your own resume-derived profile there (see README "Resume profile").
# Items marked "confirm" in profile.json are never used in drafts.
applicant:
  # completes the sentence "I'm ..."
  headline: "a project coordinator with 10 years in operations and customer service"
  # accomplishments are read from this file (items with a `use` sentence and no `confirm` flag);
  # the one that best matches each posting is used in touch 2.
  profile_file: "resumes/profile.json"
  # skills matched against each posting's text (all from the resumes)
  skills: ["project management", "scheduling", "customer service", "sales", "Excel"]
  # optional extra, true accomplishments (past tense, completes "I ..."); merged with the profile file
  accomplishments: []
