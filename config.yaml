# ---------------------------------------------------------------------------
# Job aggregator configuration. Edit freely; every key has a sane default.
# ---------------------------------------------------------------------------

search:
  # Where to look. JobSpy passes these straight to the job boards.
  location: "Atlanta, GA"
  distance_miles: 50

  # Role filter. EMPTY LIST = keep ALL job types (current default).
  # Example: roles: ["software engineer", "product manager", "data analyst"]
  # A posting is kept if its title contains any role (case-insensitive).
  # When roles are set, they also become the JobSpy search terms.
  roles: []

  # Drop postings whose TITLE contains any of these (case-insensitive).
  # Example: exclude_keywords: ["intern", "senior director", "clearance"]
  exclude_keywords: []

  remote_only: false      # true = keep only remote postings
  include_remote: false   # ATS sources: also keep remote postings outside Atlanta metro
  hours_old: 168          # JobSpy: only postings from the last N hours (7 days)

jobspy:
  enabled: true
  # Toggle each board independently. A failing board is logged and skipped.
  sites:
    indeed: true
    linkedin: true
    google: true
    zip_recruiter: true
    glassdoor: true
  # Used only when search.roles is empty (no role filter): several broad
  # queries so "all job types" still returns plenty of results.
  search_terms:
    - "full time"
    - "part time"
    - "manager"
    - "sales"
    - "customer service"
    - "engineer"
    - "nurse"
    - "analyst"
    - "driver"
    - "warehouse"
    - "administrative assistant"
    - "technician"
  results_wanted: 40          # per site, per search term
  country_indeed: "usa"
  linkedin_fetch_description: false   # true = slower, more LinkedIn requests
  fetch_description: false            # true = also fetch full descriptions for Glassdoor/ZipRecruiter (slower)
  max_consecutive_failures: 2         # stop hitting a site after N failures in a row
  apply_metro_filter: false           # boards already filter by distance; true = also require an Atlanta-metro town
  proxies: []                         # optional, e.g. ["user:pass@host:port"]

ats:
  enabled: true
  companies_file: "companies.yaml"
  concurrency: 8
  timeout_seconds: 45

# Atlanta metro matcher used for ATS postings (and JobSpy if apply_metro_filter).
metro:
  name: "Atlanta metro (~50 mi)"
  # Unambiguous town names: matched anywhere in the location string.
  towns:
    - Atlanta
    - Alpharetta
    - Sandy Springs
    - Kennesaw
    - Lawrenceville
    - Peachtree City
    - Peachtree Corners
    - Smyrna
    - Dunwoody
    - Norcross
    - Johns Creek
    - Buford
    - Douglasville
    - McDonough
    - Suwanee
    - Brookhaven
    - Chamblee
    - Doraville
    - Tucker
    - Stone Mountain
    - Lithonia
    - Conyers
    - Snellville
    - Lilburn
    - Loganville
    - Woodstock
    - Acworth
    - Cartersville
    - Newnan
    - Stockbridge
    - Jonesboro
    - College Park
    - East Point
    - Hapeville
    - Union City
    - Fairburn
    - Austell
    - Mableton
    - Vinings
    - Locust Grove
    - Flowery Branch
    - Braselton
    - Dawsonville
    - Cumming
    - Villa Rica
    - Hiram
    - Tyrone
    - Forest Park
    - Morrow
    - Riverdale
    - Fayetteville, GA
  # Town names that also exist in other states: only matched with GA/Georgia nearby.
  towns_require_state:
    - Marietta
    - Decatur
    - Roswell
    - Duluth
    - Gainesville
    - Milton
    - Canton
    - Covington
